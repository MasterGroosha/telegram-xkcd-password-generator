[project]
name = "passgenbot"
version = "2026.05.1"
description = "Telegram bot to generate passwords XKCD style"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.27.0",
    "fluent-runtime>=0.4.0",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "structlog>=25.5.0",
    "xkcdpass>=1.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:fluent",
]
